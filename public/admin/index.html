<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager | The Funhavers</title>
    <link href="./config.yml" type="text/yaml" rel="cms-config-url" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png" />
    <link rel="shortcut icon" href="../favicon.ico" />

    <style>
      /* Styles for the Link Dialog Article Picker */
      .cms-article-picker-section {
        margin-bottom: 1.1rem;
        padding: 0.85rem;
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
      }
      .cms-article-picker-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.45rem;
      }
      .cms-article-picker-title {
        font-weight: 600;
        font-size: 0.825rem;
        color: #1e293b;
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
      .cms-article-picker-hint {
        font-size: 0.75rem;
        color: #64748b;
      }
      .cms-article-filter-input,
      .cms-article-select {
        width: 100%;
        box-sizing: border-box;
        padding: 0.45rem 0.6rem;
        font-size: 0.85rem;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #ffffff;
        color: #0f172a;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .cms-article-filter-input:focus,
      .cms-article-select:focus {
        border-color: #7c3aed;
        box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.15);
      }
      .cms-article-filter-wrapper {
        margin-bottom: 0.45rem;
      }
      .cms-article-note {
        font-size: 0.75rem;
        color: #64748b;
        margin-top: 0.35rem;
        line-height: 1.3;
      }

      /* Injected Text Field Styling */
      .cms-injected-text-field {
        margin-top: 0.85rem;
      }
      .cms-injected-text-field label {
        display: block;
        font-size: 0.85rem;
        font-weight: 500;
        color: #334155;
        margin-bottom: 0.35rem;
      }

      /* Link Target (New Window) Option Styling */
      .cms-link-target-section {
        margin-top: 0.85rem;
        margin-bottom: 0.35rem;
        display: flex;
        align-items: center;
      }
      .cms-link-target-label {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        font-size: 0.85rem;
        color: #334155;
        font-weight: 500;
        cursor: pointer;
        user-select: none;
      }
      .cms-link-target-checkbox {
        width: 1.05rem;
        height: 1.05rem;
        margin: 0;
        cursor: pointer;
        accent-color: #7c3aed;
        border-radius: 4px;
      }
      .cms-link-target-label:hover .cms-link-target-text {
        color: #0f172a;
      }

      /* Sveltia CMS Docs-as-Code Component Previews */
      .starlight-preview-aside {
        border-left: 4px solid #3b82f6;
        background: #eff6ff;
        padding: 0.75rem 1rem;
        margin: 1rem 0;
        border-radius: 0 6px 6px 0;
        color: #1e293b;
      }
      .starlight-preview-aside.tip { border-color: #8b5cf6; background: #f5f3ff; }
      .starlight-preview-aside.caution { border-color: #f59e0b; background: #fffbeb; }
      .starlight-preview-aside.danger { border-color: #ef4444; background: #fef2f2; }
      .starlight-preview-aside .title { display: block; margin-bottom: 0.25rem; }
      .starlight-preview-steps {
        border-left: 2px solid #e2e8f0;
        margin: 1rem 0 1rem 0.5rem;
        padding-left: 1rem;
      }
      .starlight-preview-filetree pre {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        padding: 0.75rem;
        border-radius: 6px;
        font-size: 0.85rem;
      }
      .starlight-preview-badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.2rem 0.5rem;
        border-radius: 9999px;
        background: #f1f5f9;
        border: 1px solid #cbd5e1;
        color: #334155;
      }
      .starlight-preview-badge.note { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
      .starlight-preview-badge.tip { background: #f5f3ff; border-color: #ddd6fe; color: #6d28d9; }
      .starlight-preview-badge.caution { background: #fffbeb; border-color: #fde68a; color: #b45309; }
      .starlight-preview-badge.danger { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
      .starlight-preview-badge.success { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }

      /* Move Asset Dialog & Toolbar UI */
      .cms-move-asset-fab {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9999;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1.15rem;
        background-color: #7c3aed;
        color: #ffffff;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        border: none;
        border-radius: 9999px;
        box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4), 0 2px 6px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      }
      .cms-move-asset-fab:hover {
        background-color: #6d28d9;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5), 0 2px 8px rgba(0, 0, 0, 0.15);
      }
      .cms-move-asset-fab:active {
        transform: translateY(0);
      }
      .cms-move-asset-fab svg {
        width: 18px;
        height: 18px;
      }
      .cms-move-asset-badge {
        background-color: #ffffff;
        color: #7c3aed;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.1rem 0.45rem;
        border-radius: 9999px;
      }

      /* Injected Button for Sveltia CMS Toolbar */
      .cms-injected-move-btn {
        display: inline-flex !important;
        align-items: center !important;
        gap: 0.4rem !important;
        margin-left: 0.35rem !important;
        background-color: #7c3aed !important;
        color: #ffffff !important;
        font-weight: 500 !important;
        border-radius: 6px !important;
      }
      .cms-injected-move-btn:hover {
        background-color: #6d28d9 !important;
      }

      /* Modal Backdrop & Dialog */
      .cms-move-modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 10000;
        background-color: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        animation: cmsFadeIn 0.15s ease;
      }
      @keyframes cmsFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .cms-move-modal {
        background-color: #ffffff;
        color: #0f172a;
        width: 100%;
        max-width: 520px;
        border-radius: 12px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        border: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: cmsSlideUp 0.15s ease;
      }
      @keyframes cmsSlideUp {
        from { transform: translateY(12px) scale(0.98); opacity: 0; }
        to { transform: translateY(0) scale(1); opacity: 1; }
      }
      .cms-move-header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .cms-move-title {
        font-size: 1.05rem;
        font-weight: 600;
        color: #0f172a;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .cms-move-close {
        background: none;
        border: none;
        color: #64748b;
        cursor: pointer;
        padding: 0.25rem;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cms-move-close:hover {
        background-color: #f1f5f9;
        color: #0f172a;
      }
      .cms-move-body {
        padding: 1.25rem;
        overflow-y: auto;
        max-height: 70vh;
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
      }
      .cms-move-section {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .cms-move-label {
        font-size: 0.8rem;
        font-weight: 600;
        color: #334155;
        text-transform: uppercase;
        letter-spacing: 0.025em;
      }
      .cms-move-file-list {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        max-height: 160px;
        overflow-y: auto;
        padding: 0.5rem;
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
      }
      .cms-move-file-item {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.4rem 0.5rem;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 0.85rem;
      }
      .cms-move-file-thumb {
        width: 32px;
        height: 32px;
        object-fit: cover;
        border-radius: 4px;
        background-color: #e2e8f0;
        flex-shrink: 0;
      }
      .cms-move-file-info {
        flex: 1;
        min-width: 0;
      }
      .cms-move-file-name {
        font-weight: 600;
        color: #0f172a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cms-move-file-path {
        font-size: 0.75rem;
        color: #64748b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cms-move-file-remove {
        background: none;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        padding: 0.2rem 0.4rem;
        font-size: 1.1rem;
        line-height: 1;
        border-radius: 4px;
      }
      .cms-move-file-remove:hover {
        color: #ef4444;
        background-color: #fee2e2;
      }
      .cms-move-select,
      .cms-move-input {
        width: 100%;
        padding: 0.55rem 0.75rem;
        font-size: 0.875rem;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #ffffff;
        color: #0f172a;
        outline: none;
        box-sizing: border-box;
      }
      .cms-move-select:focus,
      .cms-move-input:focus {
        border-color: #7c3aed;
        box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.15);
      }
      .cms-move-checkbox-label {
        display: flex;
        align-items: flex-start;
        gap: 0.6rem;
        cursor: pointer;
        font-size: 0.85rem;
        color: #334155;
        user-select: none;
        line-height: 1.35;
      }
      .cms-move-checkbox {
        accent-color: #7c3aed;
        width: 1.1rem;
        height: 1.1rem;
        margin-top: 0.1rem;
        flex-shrink: 0;
      }
      .cms-move-status {
        padding: 0.75rem 1rem;
        border-radius: 6px;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        line-height: 1.4;
      }
      .cms-move-status.info {
        background-color: #eff6ff;
        border: 1px solid #bfdbfe;
        color: #1d4ed8;
      }
      .cms-move-status.success {
        background-color: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: #047857;
      }
      .cms-move-status.error {
        background-color: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
      }
      .cms-move-footer {
        padding: 0.85rem 1.25rem;
        border-top: 1px solid #e2e8f0;
        background-color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.65rem;
      }
      .cms-move-btn {
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        font-weight: 500;
        border-radius: 6px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: background-color 0.15s;
      }
      .cms-move-btn-cancel {
        background-color: #ffffff;
        border-color: #cbd5e1;
        color: #334155;
      }
      .cms-move-btn-cancel:hover {
        background-color: #f1f5f9;
      }
      .cms-move-btn-primary {
        background-color: #7c3aed;
        color: #ffffff;
        font-weight: 600;
      }
      .cms-move-btn-primary:hover:not(:disabled) {
        background-color: #6d28d9;
      }
      .cms-move-btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <!-- Load Sveltia CMS -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <script>
      /**
       * -----------------------------------------------------------------------
       * Docs-as-Code Editor Components for Sveltia CMS
       * -----------------------------------------------------------------------
       */

      // 1. Callouts / Asides (<Aside type="..." title="...">...</Aside>)
      CMS.registerEditorComponent({
        id: 'aside',
        label: 'Starlight Aside / Callout',
        fields: [
          {
            name: 'type',
            label: 'Type',
            widget: 'select',
            options: ['note', 'tip', 'caution', 'danger'],
            default: 'note'
          },
          { name: 'title', label: 'Title (Optional)', widget: 'string', required: false },
          { name: 'content', label: 'Callout Content', widget: 'markdown' }
        ],
        pattern: /^<Aside(?: type="([a-zA-Z]+)")?(?: title="([^"]*)")?>\s*([\s\S]*?)\s*<\/Aside>/,
        fromBlock: function (match) {
          return {
            type: match[1] || 'note',
            title: match[2] || '',
            content: match[3] || ''
          };
        },
        toBlock: function (obj) {
          const typeAttr = obj.type ? ` type="${obj.type}"` : '';
          const titleAttr = obj.title ? ` title="${obj.title}"` : '';
          return `<Aside${typeAttr}${titleAttr}>\n${obj.content || ''}\n</Aside>`;
        },
        toPreview: function (obj) {
          const titleHtml = obj.title ? `<strong class="title">${obj.title}</strong>` : '';
          return `
            <div class="starlight-preview-aside ${obj.type || 'note'}">
              ${titleHtml}
              <div>${obj.content || ''}</div>
            </div>
          `;
        }
      });

      // 2. Numbered Sequential Steps (<Steps>...</Steps>)
      CMS.registerEditorComponent({
        id: 'steps',
        label: 'Starlight Steps',
        fields: [
          {
            name: 'content',
            label: 'Ordered Steps (use 1. 2. 3.)',
            widget: 'markdown'
          }
        ],
        pattern: /^<Steps>\s*([\s\S]*?)\s*<\/Steps>/,
        fromBlock: function (match) {
          return { content: match[1] || '' };
        },
        toBlock: function (obj) {
          return `<Steps>\n${obj.content || ''}\n</Steps>`;
        },
        toPreview: function (obj) {
          const content = obj.content || '';
          const lines = content.split(/\r?\n/);
          const items = [];
          let current = null;
          for (const line of lines) {
            const m = line.match(/^\s*(\d+)\.\s+(.*)$/);
            if (m) {
              if (current !== null) items.push(current.trim());
              current = m[2];
            } else if (current !== null && line.trim()) {
              current += ' ' + line.trim();
            }
          }
          if (current !== null) items.push(current.trim());
          if (items.length === 0 && content.trim()) items.push(content.trim());

          const listHtml = items.map(function(item) {
            const parsed = item
              .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
              .replace(/_([^_]+)_/g, '<em>$1</em>')
              .replace(/`([^`]+)`/g, '<code>$1</code>');
            return '<li style="margin-bottom: 0.75rem;">' + parsed + '</li>';
          }).join('');

          return `
            <div class="starlight-preview-steps" style="border-left: 3px solid #7c3aed; padding-left: 1.25rem; margin: 1rem 0;">
              <ol style="padding-left: 1.25rem; margin: 0; line-height: 1.6;">${listHtml}</ol>
            </div>
          `;
        }
      });

      // 3. Directory File Tree (<FileTree>...</FileTree>)
      CMS.registerEditorComponent({
        id: 'filetree',
        label: 'Starlight File Tree',
        fields: [
          {
            name: 'tree',
            label: 'File Tree Structure (indented markdown list)',
            widget: 'markdown'
          }
        ],
        pattern: /^<FileTree>\s*([\s\S]*?)\s*<\/FileTree>/,
        fromBlock: function (match) {
          return { tree: match[1] || '' };
        },
        toBlock: function (obj) {
          return `<FileTree>\n${obj.tree || ''}\n</FileTree>`;
        },
        toPreview: function (obj) {
          return `
            <div class="starlight-preview-filetree">
              <pre>${obj.tree || ''}</pre>
            </div>
          `;
        }
      });

      // 4. Badges (<Badge text="..." variant="..." size="..." />)
      CMS.registerEditorComponent({
        id: 'badge',
        label: 'Starlight Badge',
        fields: [
          { name: 'text', label: 'Badge Text', widget: 'string', required: true },
          {
            name: 'variant',
            label: 'Color Variant',
            widget: 'select',
            options: ['default', 'note', 'tip', 'caution', 'danger', 'success'],
            default: 'default'
          },
          {
            name: 'size',
            label: 'Size',
            widget: 'select',
            options: ['small', 'medium', 'large'],
            default: 'medium'
          }
        ],
        pattern: /^<Badge text="([^"]+)"(?: variant="([^"]+)")?(?: size="([^"]+)")?\s*\/>/,
        fromBlock: function (match) {
          return {
            text: match[1] || 'Badge',
            variant: match[2] || 'default',
            size: match[3] || 'medium'
          };
        },
        toBlock: function (obj) {
          const variant = obj.variant ? ` variant="${obj.variant}"` : '';
          const size = obj.size ? ` size="${obj.size}"` : '';
          return `<Badge text="${obj.text}"${variant}${size} />`;
        },
        toPreview: function (obj) {
          return `<span class="starlight-preview-badge ${obj.variant || 'default'}">${obj.text || ''}</span>`;
        }
      });

      // 5. Dual-Tab Switcher (<Tabs><TabItem label="...">...</TabItem></Tabs>)
      CMS.registerEditorComponent({
        id: 'tabs',
        label: 'Starlight Tabs (2 Tabs)',
        fields: [
          { name: 'tab1_label', label: 'Tab 1 Label', widget: 'string', default: 'Tab 1' },
          { name: 'tab1_content', label: 'Tab 1 Content', widget: 'markdown' },
          { name: 'tab2_label', label: 'Tab 2 Label', widget: 'string', default: 'Tab 2' },
          { name: 'tab2_content', label: 'Tab 2 Content', widget: 'markdown' }
        ],
        pattern: /^<Tabs>\s*<TabItem label="([^"]+)">\s*([\s\S]*?)\s*<\/TabItem>\s*<TabItem label="([^"]+)">\s*([\s\S]*?)\s*<\/TabItem>\s*<\/Tabs>/,
        fromBlock: function (match) {
          return {
            tab1_label: match[1] || 'Tab 1',
            tab1_content: match[2] || '',
            tab2_label: match[3] || 'Tab 2',
            tab2_content: match[4] || ''
          };
        },
        toBlock: function (obj) {
          return `<Tabs>\n  <TabItem label="${obj.tab1_label || 'Tab 1'}">\n    ${obj.tab1_content || ''}\n  </TabItem>\n  <TabItem label="${obj.tab2_label || 'Tab 2'}">\n    ${obj.tab2_content || ''}\n  </TabItem>\n</Tabs>`;
        },
        toPreview: function (obj) {
          return `
            <div style="border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden; margin: 1rem 0;">
              <div style="display: flex; background: #f3f4f6; border-bottom: 1px solid #e5e7eb;">
                <div style="padding: 0.5rem 1rem; border-bottom: 2px solid #7c3aed; font-weight: 600; background: #fff;">${obj.tab1_label || 'Tab 1'}</div>
                <div style="padding: 0.5rem 1rem; color: #6b7280;">${obj.tab2_label || 'Tab 2'}</div>
              </div>
              <div style="padding: 1rem;">${obj.tab1_content || ''}</div>
            </div>
          `;
        }
      });
      /**
       * -----------------------------------------------------------------------
       * Article Dataset & Link Management for Sveltia CMS
       * -----------------------------------------------------------------------
       */
      const INITIAL_ARTICLES = [
        { "title": "This is the end.", "route": "/posts/this-is-the-end./", "desc": "Hello, goodbye.", "category": "Blog Posts" },
        { "title": "The Funhavers", "route": "/", "desc": "A blog by The Funhavers.", "category": "Home" },
        { "title": "About", "route": "/about/", "desc": "A bit about me and this blog.", "category": "Pages" },
        { "title": "Archives", "route": "/archives/", "desc": "All archived blog posts.", "category": "Pages" },
        { "title": "Search", "route": "/search/", "desc": "Search blog posts.", "category": "Pages" },
        { "title": "Tags", "route": "/tags/", "desc": "Browse posts by tag.", "category": "Pages" }
      ];

      let articlesList = [...INITIAL_ARTICLES];

      function getArticleSelectOptions() {
        return articlesList.map(function (a) {
          const catLabel = a.category && a.category !== 'Home' ? ' (' + a.category.replace(/^[0-9.]+\s*/, '') + ')' : '';
          return {
            label: a.title + catLabel,
            value: a.route
          };
        });
      }

      function getArticleByRoute(route) {
        if (!route) return null;
        const norm = route.endsWith('/') ? route : route + '/';
        for (let i = 0; i < articlesList.length; i++) {
          const r = articlesList[i].route;
          const rNorm = r.endsWith('/') ? r : r + '/';
          if (rNorm === norm || r === route) {
            return articlesList[i];
          }
        }
        return null;
      }

      function escapeAttr(str) {
        return (str || '').replace(/"/g, '&quot;');
      }

      /**
       * -----------------------------------------------------------------------
       * Native Sveltia CMS Link Dialog Enhancer
       * Injects a searchable article picker into Sveltia CMS's native Link dialog.
       * -----------------------------------------------------------------------
       */
      function setInputValue(input, val) {
        if (!input) return;
        const descriptor = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value');
        if (descriptor && descriptor.set) {
          descriptor.set.call(input, val);
        } else {
          input.value = val;
        }
        input.dispatchEvent(new Event('input', { bubbles: true, cancelable: true }));
        input.dispatchEvent(new Event('change', { bubbles: true, cancelable: true }));
      }

      function enhanceLinkDialog(dialog) {
        if (!dialog) return;

        const urlInput = dialog.querySelector('input[id$="-url"], input[aria-label="URL"]');
        if (!urlInput) return;

        // 1. Locate the outer container for the URL field
        const urlLabel = dialog.querySelector('label[for="' + urlInput.id + '"]') || (urlInput.labels && urlInput.labels[0]);
        const urlFieldContainer = urlLabel
          ? (urlLabel.closest('div[role="none"]') || urlLabel.parentElement)
          : (urlInput.closest('[role="none"]')?.parentElement || urlInput.parentElement);
        if (!urlFieldContainer || !urlFieldContainer.parentNode) return;

        // 2. Ensure the "Pick from Existing Articles" section exists and is placed BEFORE the URL field
        let picker = dialog.querySelector('.cms-article-picker-section');
        if (!picker) {
          picker = document.createElement('div');
          picker.className = 'cms-article-picker-section';
          picker.innerHTML = `
            <div class="cms-article-picker-header">
              <label class="cms-article-picker-title">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #7c3aed;">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
                Pick from Existing Articles
              </label>
              <span class="cms-article-picker-hint">(Auto-fills URL &amp; title)</span>
            </div>
            <div class="cms-article-filter-wrapper">
              <input type="search" class="cms-article-filter-input" placeholder="Search articles by title or section..." />
            </div>
            <div>
              <select class="cms-article-select">
                <option value="">-- Choose an existing article (or enter URL below) --</option>
              </select>
            </div>
            <div class="cms-article-note">Selecting an article populates the destination URL and link text.</div>
          `;

          const filterInput = picker.querySelector('.cms-article-filter-input');
          const select = picker.querySelector('.cms-article-select');

          filterInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              e.stopPropagation();
            }
          });

          function renderSelectOptions(filterText) {
            const query = (filterText || '').toLowerCase().trim();
            select.innerHTML = '<option value="">-- Choose an existing article (or enter URL below) --</option>';

            const categories = {};
            articlesList.forEach(function (art) {
              const cat = art.category || 'Other';
              if (!categories[cat]) categories[cat] = [];
              categories[cat].push(art);
            });

            Object.keys(categories).forEach(function (cat) {
              const matching = categories[cat].filter(function (art) {
                if (!query) return true;
                return (
                  art.title.toLowerCase().includes(query) ||
                  (art.desc && art.desc.toLowerCase().includes(query)) ||
                  cat.toLowerCase().includes(query) ||
                  art.route.toLowerCase().includes(query)
                );
              });

              if (matching.length > 0) {
                const optgroup = document.createElement('optgroup');
                optgroup.label = cat;
                matching.forEach(function (art) {
                  const opt = document.createElement('option');
                  opt.value = art.route;
                  opt.textContent = art.title;
                  opt.dataset.title = art.title;
                  opt.dataset.desc = art.desc || '';
                  if (urlInput.value && (urlInput.value === art.route || urlInput.value === art.route.replace(/\/$/, ''))) {
                    opt.selected = true;
                  }
                  optgroup.appendChild(opt);
                });
                select.appendChild(optgroup);
              }
            });
          }

          renderSelectOptions('');

          filterInput.addEventListener('input', function () {
            renderSelectOptions(filterInput.value);
          });

          select.addEventListener('change', function () {
            const selectedRoute = select.value;
            if (!selectedRoute) return;

            setInputValue(urlInput, selectedRoute);
            if (!dialog._isUserToggledTarget) {
              const cb = dialog.querySelector('.cms-link-target-checkbox');
              if (cb) cb.checked = false;
            }

            const currentTextInput = dialog.querySelector('input[id$="-text"], input[aria-label="Text"]');
            const selectedOpt = select.options[select.selectedIndex];
            const title = selectedOpt ? selectedOpt.dataset.title : '';

            if (currentTextInput && title) {
              if (!currentTextInput.value || currentTextInput.value === dialog._originalSelectedText || currentTextInput.value === selectedRoute) {
                setInputValue(currentTextInput, title);
              }
            }
          });
        }

        // Place picker immediately BEFORE the URL field container so URL label stays above the URL field
        if (picker.parentNode !== urlFieldContainer.parentNode || picker.nextSibling !== urlFieldContainer) {
          urlFieldContainer.parentNode.insertBefore(picker, urlFieldContainer);
        }

        // 3. Ensure the Text field exists and is placed right after the URL field
        let builtInTextInput = dialog.querySelector('input[id$="-text"]:not(.cms-injected-input), input[aria-label="Text"]:not(.cms-injected-input)');
        let activeTextFieldContainer = null;
        let activeTextInput = null;
        let isInjectedText = false;

        if (builtInTextInput) {
          // Sveltia rendered its native Text field
          const prevInjected = dialog.querySelector('.cms-injected-text-field');
          if (prevInjected) prevInjected.remove();

          const textLabel = dialog.querySelector('label[for="' + builtInTextInput.id + '"]') || (builtInTextInput.labels && builtInTextInput.labels[0]);
          activeTextFieldContainer = textLabel
            ? (textLabel.closest('div[role="none"]') || textLabel.parentElement)
            : (builtInTextInput.closest('[role="none"]')?.parentElement || builtInTextInput.parentElement);
          activeTextInput = builtInTextInput;
        } else {
          // Sveltia omitted the Text field (text was selected) - inject matching Text field
          isInjectedText = true;
          let injectedContainer = dialog.querySelector('.cms-injected-text-field');
          if (!injectedContainer) {
            const textInputId = urlInput.id ? urlInput.id.replace(/-url$/, '-text') : 'cms-link-text-input';
            injectedContainer = document.createElement('div');
            injectedContainer.setAttribute('role', 'none');
            injectedContainer.className = 'cms-injected-text-field';
            const wrapperClass = (urlInput.parentElement && urlInput.parentElement.className) || 'sui text-field';
            const inputClass = urlInput.className || '';
            injectedContainer.innerHTML = `
              <label for="${textInputId}">Text</label>
              <div role="none" class="${wrapperClass}">
                <input type="text" dir="auto" id="${textInputId}" class="${inputClass} cms-injected-input" aria-label="Text" />
              </div>
            `;
          }
          activeTextFieldContainer = injectedContainer;
          activeTextInput = injectedContainer.querySelector('input');
        }

        // Position activeTextFieldContainer right AFTER urlFieldContainer
        if (activeTextFieldContainer.parentNode !== urlFieldContainer.parentNode || urlFieldContainer.nextSibling !== activeTextFieldContainer) {
          urlFieldContainer.parentNode.insertBefore(activeTextFieldContainer, urlFieldContainer.nextSibling);
        }

        // 4. Ensure "Open link in a new window" checkbox section exists and is placed BELOW the Text field
        let targetSection = dialog.querySelector('.cms-link-target-section');
        if (!targetSection) {
          targetSection = document.createElement('div');
          targetSection.className = 'cms-link-target-section';
          targetSection.innerHTML = `
            <label class="cms-link-target-label">
              <input type="checkbox" class="cms-link-target-checkbox" id="cms-link-target-blank" />
              <span class="cms-link-target-text">Open link in a new window</span>
            </label>
          `;
          const cb = targetSection.querySelector('.cms-link-target-checkbox');
          cb.addEventListener('change', function () {
            dialog._isUserToggledTarget = true;
          });
        }

        // Position targetSection right AFTER activeTextFieldContainer
        if (targetSection.parentNode !== activeTextFieldContainer.parentNode || activeTextFieldContainer.nextSibling !== targetSection) {
          activeTextFieldContainer.parentNode.insertBefore(targetSection, activeTextFieldContainer.nextSibling);
        }

        const targetCheckbox = targetSection.querySelector('.cms-link-target-checkbox');

        // Helper: Check if a URL is external
        function checkIsExternal(val) {
          return /^(https?:)?\/\//i.test(val);
        }

        // 5. Initialize field values and checkbox state on dialog open
        if (!dialog._cmsStateInitialized || dialog.dataset.cmsOpenState !== 'true') {
          dialog.dataset.cmsOpenState = 'true';
          dialog._cmsStateInitialized = true;
          dialog._isUserToggledTarget = false;

          let rawUrl = (urlInput.value || '').trim();
          let cleanUrl = rawUrl.replace(/#(?:_blank|_self)$/, '');
          let hasBlank = rawUrl.endsWith('#_blank');
          let hasSelf = rawUrl.endsWith('#_self');
          let isExternal = checkIsExternal(cleanUrl);
          let isLikelyUrl = isExternal || cleanUrl.startsWith('/') || cleanUrl.startsWith('#') || cleanUrl.startsWith('mailto:') || cleanUrl.startsWith('./') || cleanUrl.startsWith('../');

          if (isInjectedText) {
            if (hasBlank || hasSelf || dialog.querySelector('.title')?.textContent?.includes('Update') || isLikelyUrl) {
              setInputValue(urlInput, cleanUrl);
              targetCheckbox.checked = hasBlank || (!hasSelf && isExternal);
              if (hasSelf) dialog._isUserToggledTarget = true;

              let linkText = window.getSelection()?.toString()?.trim() || '';
              if (!linkText && cleanUrl) {
                const linkEl = document.querySelector('.lexical-root a[href*="' + cleanUrl + '"]');
                if (linkEl) linkText = linkEl.textContent.trim();
              }
              setInputValue(activeTextInput, linkText || cleanUrl);
              dialog._originalSelectedText = linkText || cleanUrl;
            } else if (rawUrl) {
              setInputValue(activeTextInput, rawUrl);
              dialog._originalSelectedText = rawUrl;
              setInputValue(urlInput, '');
              targetCheckbox.checked = false;
            } else {
              setInputValue(activeTextInput, '');
              dialog._originalSelectedText = '';
              targetCheckbox.checked = false;
            }
          } else {
            if (hasBlank) {
              targetCheckbox.checked = true;
              setInputValue(urlInput, cleanUrl);
            } else if (hasSelf) {
              targetCheckbox.checked = false;
              dialog._isUserToggledTarget = true;
              setInputValue(urlInput, cleanUrl);
            } else {
              targetCheckbox.checked = isExternal;
            }
            dialog._originalSelectedText = '';
          }
        }

        // 6. Dynamic input listener on urlInput
        if (!urlInput._cmsTargetListenerAttached) {
          urlInput._cmsTargetListenerAttached = true;
          urlInput.addEventListener('input', function () {
            const val = urlInput.value.trim();
            if (!dialog._isUserToggledTarget) {
              if (checkIsExternal(val)) {
                targetCheckbox.checked = true;
              } else if (val.startsWith('/') || val.startsWith('#')) {
                targetCheckbox.checked = false;
              }
            }
          });
        }

        // 7. Format URL and replace text before submission
        function applyLinkTargetToInput() {
          let currentVal = urlInput.value.trim();
          if (!currentVal) return;

          currentVal = currentVal.replace(/#(?:_blank|_self)$/, '');

          if (targetCheckbox.checked) {
            setInputValue(urlInput, currentVal + '#_blank');
          } else {
            if (checkIsExternal(currentVal) && dialog._isUserToggledTarget) {
              setInputValue(urlInput, currentVal + '#_self');
            } else {
              setInputValue(urlInput, currentVal);
            }
          }
        }

        function handleInsertAction() {
          if (isInjectedText && activeTextInput) {
            const newText = activeTextInput.value.trim();
            if (newText && newText !== dialog._originalSelectedText) {
              const lexicalRoot = document.querySelector('.lexical-root');
              const editor = lexicalRoot?.__lexicalEditor;
              if (editor && editor._commands) {
                for (const [cmdKey] of editor._commands) {
                  if (cmdKey && cmdKey.type === 'CONTROLLED_TEXT_INSERTION_COMMAND') {
                    editor.dispatchCommand(cmdKey, newText);
                    break;
                  }
                }
              }
            }
          }

          applyLinkTargetToInput();
        }

        // Enter key inside injected text input triggers submission
        if (isInjectedText && activeTextInput && !activeTextInput._cmsEnterListenerAttached) {
          activeTextInput._cmsEnterListenerAttached = true;
          activeTextInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              handleInsertAction();
              const primaryBtn = dialog.querySelector('button.primary, button[type="submit"]');
              if (primaryBtn) primaryBtn.click();
            }
          });
        }

        // Intercept primary action button click (capture phase)
        if (!dialog._cmsClickCaptureAttached) {
          dialog._cmsClickCaptureAttached = true;
          dialog.addEventListener('click', function (e) {
            const btn = e.target.closest('button');
            if (!btn) return;
            const isCancel = btn.textContent && (btn.textContent.includes('Cancel') || btn.textContent.includes('cancel'));
            if (!isCancel && (btn.classList.contains('primary') || btn.type === 'submit' || (btn.parentElement && btn.parentElement.tagName === 'FOOTER') || btn.closest('.footer'))) {
              handleInsertAction();
            }
          }, true);
        }

        // Intercept Enter keydown in dialog (capture phase)
        if (!dialog._cmsKeydownCaptureAttached) {
          dialog._cmsKeydownCaptureAttached = true;
          dialog.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
              if (e.target && e.target.classList.contains('cms-article-filter-input')) {
                return;
              }
              handleInsertAction();
            }
          }, true);
        }
      }

      function initLinkDialogObserver() {
        const observer = new MutationObserver(function (mutations) {
          for (let i = 0; i < mutations.length; i++) {
            const m = mutations[i];
            if (m.type === 'childList') {
              for (let j = 0; j < m.addedNodes.length; j++) {
                const node = m.addedNodes[j];
                if (node.nodeType === Node.ELEMENT_NODE) {
                  if (node.matches && (node.matches('dialog') || node.matches('.sui.dialog'))) {
                    enhanceLinkDialog(node);
                  }
                  const dialogs = node.querySelectorAll ? node.querySelectorAll('dialog, .sui.dialog') : [];
                  for (let k = 0; k < dialogs.length; k++) {
                    enhanceLinkDialog(dialogs[k]);
                  }
                }
              }
            } else if (m.type === 'attributes' && m.attributeName === 'open') {
              if (m.target) {
                if (m.target.open) {
                  enhanceLinkDialog(m.target);
                } else {
                  m.target.dataset.cmsOpenState = 'false';
                  m.target._cmsStateInitialized = false;
                }
              }
            }
          }
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['open']
        });

        const existingDialogs = document.querySelectorAll('dialog, .sui.dialog');
        for (let d = 0; d < existingDialogs.length; d++) {
          enhanceLinkDialog(existingDialogs[d]);
        }
      }

      async function syncArticles() {
        try {
          const res = await fetch('/admin/articles.json');
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              articlesList = data;
            }
          }
        } catch (e) {
          // Fallback to INITIAL_ARTICLES
        }

        // Check IndexedDB for newly added or drafted files in this session
        try {
          if (window.indexedDB && window.indexedDB.databases) {
            const dbs = await window.indexedDB.databases();
            for (let i = 0; i < dbs.length; i++) {
              const dbName = dbs[i].name;
              if (dbName && (dbName.includes('timothyjohnsonwrites') || dbName.includes('blog-thefunhavers') || dbName.startsWith('github:'))) {
                const req = window.indexedDB.open(dbName);
                req.onsuccess = function (ev) {
                  const db = ev.target.result;
                  if (db.objectStoreNames.contains('file-cache')) {
                    const tx = db.transaction('file-cache', 'readonly');
                    const store = tx.objectStore('file-cache');
                    const getAllReq = store.getAll();
                    getAllReq.onsuccess = function () {
                      const items = getAllReq.result || [];
                      items.forEach(function (item) {
                        if (item && item.path && (item.path.startsWith('src/content/posts/') || item.path.startsWith('src/content/pages/') || item.path.startsWith('src/content/custom-pages/')) && (item.path.endsWith('.mdx') || item.path.endsWith('.md'))) {
                          const text = item.text || (item.data && item.data.text) || '';
                          const titleM = text.match(/^title:\s*["'`]?(.*?)["'`]?$/m);
                          const slugM = text.match(/^slug:\s*["'`]?(.*?)["'`]?$/m);
                          const title = titleM ? titleM[1].trim() : '';
                          if (title) {
                            let route = '/';
                            if (item.path.startsWith('src/content/posts/')) {
                              const rel = item.path.replace(/^src\/content\/posts\//, '');
                              const parts = rel.split('/').filter(Boolean).filter(function (p) { return !p.startsWith('_'); }).slice(0, -1);
                              const base = rel.split('/').pop().replace(/\.(mdx|md)$/, '');
                              const slugPath = parts.length > 0 ? parts.join('/') + '/' + base : base;
                              route = '/posts/' + slugPath + '/';
                            } else if (item.path.startsWith('src/content/custom-pages/')) {
                              const customSlug = slugM ? slugM[1].trim().replace(/^\/+|\/+$/g, '') : item.path.replace(/^src\/content\/custom-pages\//, '').replace(/\.(mdx|md)$/, '');
                              route = '/' + customSlug + '/';
                            } else if (item.path.startsWith('src/content/pages/')) {
                              const rel = item.path.replace(/^src\/content\/pages\//, '');
                              route = '/' + rel.replace(/\.(mdx|md)$/, '') + '/';
                            }

                            const exists = articlesList.some(function (a) { return a.route === route; });
                            if (!exists) {
                              articlesList.push({
                                title: title,
                                route: route,
                                desc: '',
                                category: 'Recent Drafts',
                                file: item.path
                              });
                            }
                          }
                        }
                      });
                    };
                  }
                };
              }
            }
          }
        } catch (err) {
          // Graceful fallback
        }
      }

      /**
       * -----------------------------------------------------------------------
       * Media Subfolder & Asset Organizer UI for Sveltia CMS
       * Allows selecting images in the CMS UI, moving them into subfolders,
       * and automatically updating all links across Markdown posts and pages.
       * -----------------------------------------------------------------------
       */
      const GITHUB_REPO = 'write-tim/timothyjohnsonwrites';
      const GITHUB_BRANCH = 'main';

      function getStoredGitHubToken() {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          try {
            const val = localStorage.getItem(key);
            if (!val) continue;
            if (val.startsWith('ghp_') || val.startsWith('gho_') || val.startsWith('github_pat_')) {
              return val;
            }
            const obj = JSON.parse(val);
            if (obj && typeof obj === 'object') {
              if (typeof obj.token === 'string' && obj.token) return obj.token;
              if (typeof obj.access_token === 'string' && obj.access_token) return obj.access_token;
              if (obj.backend && typeof obj.backend.token === 'string') return obj.backend.token;
            }
          } catch (e) {}
        }
        return localStorage.getItem('sveltia-cms.pat') || '';
      }

      async function fetchRepoTree(token) {
        const headers = {
          Accept: 'application/vnd.github.v3+json',
        };
        if (token) {
          headers.Authorization = `Bearer ${token}`;
        }

        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`, {
          headers
        });
        if (!res.ok) {
          throw new Error(`GitHub API error (${res.status}): ${await res.text()}`);
        }
        const data = await res.json();
        return data.tree || [];
      }

      function detectSelectedAssetPaths() {
        const selected = new Set();

        // 1. Check checked inputs inside asset views
        const checkedBoxes = document.querySelectorAll('main input[type="checkbox"]:checked, dialog input[type="checkbox"]:checked');
        checkedBoxes.forEach(cb => {
          const card = cb.closest('[role="row"], li, [role="button"], .card, article') || cb.parentElement;
          const text = card ? card.textContent : '';
          const m = text.match(/([a-zA-Z0-9_\-\s.]+\.(jpe?g|png|webp|gif|svg|avif))/i);
          if (m) selected.add(m[1].trim());
        });

        // 2. Check aria-selected elements
        const selectedEls = document.querySelectorAll('[aria-selected="true"]');
        selectedEls.forEach(el => {
          const text = el.textContent || '';
          const m = text.match(/([a-zA-Z0-9_\-\s.]+\.(jpe?g|png|webp|gif|svg|avif))/i);
          if (m) selected.add(m[1].trim());
        });

        // 3. Check active asset details pane / panel
        const detailPanels = document.querySelectorAll('[role="dialog"], aside, .details-pane');
        detailPanels.forEach(panel => {
          const heading = panel.querySelector('h1, h2, h3, .title, .filename');
          if (heading && heading.textContent) {
            const m = heading.textContent.match(/([a-zA-Z0-9_\-\s.]+\.(jpe?g|png|webp|gif|svg|avif))/i);
            if (m) selected.add(m[1].trim());
          }
        });

        return Array.from(selected);
      }

            <div class="cms-move-footer">
              <button type="button" class="cms-move-btn cms-move-btn-cancel" id="cms-move-cancel-btn">Cancel</button>
              <button type="button" class="cms-move-btn cms-move-btn-primary" id="cms-move-submit-btn">Move &amp; Update Links</button>
            </div>
          </div>
        `;

        document.body.appendChild(backdrop);

        const closeBtn = backdrop.querySelector('.cms-move-close');
        const cancelBtn = backdrop.querySelector('#cms-move-cancel-btn');
        const submitBtn = backdrop.querySelector('#cms-move-submit-btn');
        const fileListEl = backdrop.querySelector('#cms-move-file-list');
        const addAssetSelect = backdrop.querySelector('#cms-move-add-asset-select');
        const folderSelect = backdrop.querySelector('#cms-move-folder-select');
        const customFolderInput = backdrop.querySelector('#cms-move-custom-folder');
        const updateLinksCb = backdrop.querySelector('#cms-move-update-links');
        const statusBox = backdrop.querySelector('#cms-move-status-box');
        const tokenInput = backdrop.querySelector('#cms-move-token-input');

        const closeModal = () => backdrop.remove();
        closeBtn.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);
        backdrop.addEventListener('click', (e) => {
          if (e.target === backdrop) closeModal();
        });

        folderSelect.addEventListener('change', () => {
          customFolderInput.style.display = folderSelect.value === '__NEW__' ? 'block' : 'none';
          if (folderSelect.value === '__NEW__') customFolderInput.focus();
        });

        let availableAssets = [];
        let selectedFiles = [];
        let allContentFiles = [];

        function renderSelectedFiles() {
          if (selectedFiles.length === 0) {
            fileListEl.innerHTML = `<div style="font-size: 0.85rem; color: #64748b; padding: 0.5rem; text-align: center;">No images selected. Choose an image below.</div>`;
            return;
          }

          fileListEl.innerHTML = '';
          selectedFiles.forEach((f, idx) => {
            const item = document.createElement('div');
            item.className = 'cms-move-file-item';
            const publicUrl = `/${f.path.replace(/^public\//, '')}`;
            item.innerHTML = `
              <img class="cms-move-file-thumb" src="${publicUrl}" alt="" onerror="this.style.display='none'" />
              <div class="cms-move-file-info">
                <div class="cms-move-file-name">${f.name}</div>
                <div class="cms-move-file-path">${f.path}</div>
              </div>
              <button type="button" class="cms-move-file-remove" title="Remove from move list">&times;</button>
            `;
            item.querySelector('.cms-move-file-remove').addEventListener('click', () => {
              selectedFiles.splice(idx, 1);
              renderSelectedFiles();
            });
            fileListEl.appendChild(item);
          });
        }

        addAssetSelect.addEventListener('change', () => {
          const chosenPath = addAssetSelect.value;
          if (!chosenPath) return;
          const found = availableAssets.find(a => a.path === chosenPath);
          if (found && !selectedFiles.some(f => f.path === chosenPath)) {
            selectedFiles.push(found);
            renderSelectedFiles();
          }
          addAssetSelect.value = '';
        });

        // Fetch tree and populate dropdowns
        try {
          const currentToken = tokenInput.value || getStoredGitHubToken();
          const tree = await fetchRepoTree(currentToken);

          // Extract assets under public/assets/
          availableAssets = tree
            .filter(item => item.path.startsWith('public/assets/') && item.type === 'blob' && !item.path.endsWith('.gitkeep'))
            .map(item => ({
              path: item.path,
              sha: item.sha,
              name: item.path.split('/').pop(),
              folder: item.path.split('/').slice(0, -1).join('/')
            }));

          // Extract content files (markdown/yaml)
          allContentFiles = tree.filter(item =>
            (item.path.startsWith('src/content/') || item.path.startsWith('src/pages/')) &&
            item.type === 'blob' &&
            /\.(md|mdx|yaml|yml|json|astro)$/i.test(item.path)
          );

          // Extract existing subfolders in public/assets/
          const existingFolders = new Set();
          tree.forEach(item => {
            if (item.path.startsWith('public/assets/')) {
              const rel = item.path.replace(/^public\/assets\//, '');
              const parts = rel.split('/');
              if (parts.length > 1) {
                // e.g. trips/Big Sur or blog/travel
                const category = parts[0];
                const subfolder = parts[1];
                if (subfolder && !subfolder.includes('.')) {
                  existingFolders.add(`${category}/${subfolder}`);
                }
              }
            }
          });

          // Populate folder select
          folderSelect.innerHTML = `
            <option value="">-- Choose destination subfolder --</option>
            <option value="__NEW__">+ Create new subfolder...</option>
          `;
          Array.from(existingFolders).sort().forEach(folderPath => {
            const opt = document.createElement('option');
            opt.value = folderPath;
            opt.textContent = folderPath;
            folderSelect.appendChild(opt);
          });

          // Populate add asset dropdown
          addAssetSelect.innerHTML = `<option value="">+ Add an image from repository...</option>`;
          availableAssets.forEach(a => {
            const opt = document.createElement('option');
            opt.value = a.path;
            opt.textContent = `${a.name} (${a.path.replace(/^public\/assets\//, '')})`;
            addAssetSelect.appendChild(opt);
          });

          // Preselect files based on initial selection or active context
          if (Array.isArray(initialSelected) && initialSelected.length > 0) {
            initialSelected.forEach(selName => {
              const match = availableAssets.find(a => a.name === selName || a.path.endsWith('/' + selName));
              if (match && !selectedFiles.some(f => f.path === match.path)) {
                selectedFiles.push(match);
              }
            });
          }

          renderSelectedFiles();
        } catch (err) {
          fileListEl.innerHTML = `<div style="color: #b91c1c; font-size: 0.85rem; padding: 0.5rem;">Failed to load assets: ${err.message}. Please verify your GitHub token.</div>`;
        }

        // Handle Submit
        submitBtn.addEventListener('click', async () => {
          let authToken = tokenInput.value.trim() || getStoredGitHubToken();
          if (!authToken) {
            alert('Please provide a GitHub Personal Access Token to authorize moving assets.');
            return;
          }
          localStorage.setItem('sveltia-cms.pat', authToken);

          if (selectedFiles.length === 0) {
            alert('Please select at least one image to move.');
            return;
          }

          let destFolder = folderSelect.value;
          if (destFolder === '__NEW__') {
            destFolder = customFolderInput.value.trim();
          }
          if (!destFolder) {
            alert('Please select or enter a destination folder.');
            return;
          }

          // Format destFolder (e.g. if user typed "Zion", prefix with trips/ or blog/ based on first selected file)
          let finalFolder = destFolder;
          if (!finalFolder.includes('/')) {
            const sample = selectedFiles[0];
            const cat = sample.path.replace(/^public\/assets\//, '').split('/')[0] || 'trips';
            finalFolder = `${cat}/${destFolder}`;
          }

          submitBtn.disabled = true;
          cancelBtn.disabled = true;
          statusBox.style.display = 'block';
          statusBox.className = 'cms-move-status info';
          statusBox.innerHTML = `<span>⏳ Step 1/4: Fetching latest repository commit...</span>`;

          const headers = {
            Accept: 'application/vnd.github.v3+json',
            Authorization: `Bearer ${authToken}`,
            'Content-Type': 'application/json'
          };

          try {
            // 1. Get branch commit SHA
            const refRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/git/ref/heads/${GITHUB_BRANCH}`, { headers });
            if (!refRes.ok) throw new Error(`Failed to fetch branch reference: ${await refRes.text()}`);
            const commitSha = (await refRes.json()).object.sha;

            // 2. Get base tree SHA
            const commitRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/git/commits/${commitSha}`, { headers });
            if (!commitRes.ok) throw new Error(`Failed to fetch commit: ${await commitRes.text()}`);
            const baseTreeSha = (await commitRes.json()).tree.sha;

            statusBox.innerHTML = `<span>⏳ Step 2/4: Checking Markdown posts and pages for links...</span>`;

            const treeUpdates = [];
            const movedFilesMapping = [];

            for (const file of selectedFiles) {
              const newPath = `public/assets/${finalFolder}/${file.name}`;
              if (file.path === newPath) continue;

              const oldPublicUrl = `/${file.path.replace(/^public\//, '')}`;
              const newPublicUrl = `/${newPath.replace(/^public\//, '')}`;

              movedFilesMapping.push({
                oldPath: file.path,
                newPath: newPath,
                oldUrl: oldPublicUrl,
                newUrl: newPublicUrl,
                sha: file.sha
              });

              // Add to git tree
              treeUpdates.push({
                path: newPath,
                mode: '100644',
                type: 'blob',
                sha: file.sha
              });
              treeUpdates.push({
                path: file.path,
                mode: '100644',
                type: 'blob',
                sha: null // deletes old file
              });
            }

            let updatedContentCount = 0;

            if (updateLinksCb.checked && movedFilesMapping.length > 0) {
              for (const contentFile of allContentFiles) {
                const blobRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/git/blobs/${contentFile.sha}`, { headers });
                if (!blobRes.ok) continue;
                const blobData = await blobRes.json();
                const rawBase64 = blobData.content.replace(/\s/g, '');
                const originalText = decodeURIComponent(escape(atob(rawBase64)));

                let modifiedText = originalText;
                let changed = false;

                for (const m of movedFilesMapping) {
                  const variants = [
                    { from: m.oldUrl, to: m.newUrl },
                    { from: encodeURI(m.oldUrl), to: encodeURI(m.newUrl) },
                    { from: m.oldUrl.replace(/^\//, ''), to: m.newUrl.replace(/^\//, '') },
                    { from: encodeURI(m.oldUrl.replace(/^\//, '')), to: encodeURI(m.newUrl.replace(/^\//, '')) },
                  ];

                  for (const v of variants) {
                    if (v.from !== v.to && modifiedText.includes(v.from)) {
                      modifiedText = modifiedText.replaceAll(v.from, v.to);
                      changed = true;
                    }
                  }
                }

                if (changed) {
                  // Create new blob for modified content file
                  const newBlobRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/git/blobs`, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({
                      content: unescape(encodeURIComponent(modifiedText)),
                      encoding: 'utf-8'
                    })
                  });
                  if (!newBlobRes.ok) throw new Error(`Failed to create updated blob for ${contentFile.path}`);
                  const newBlobSha = (await newBlobRes.json()).sha;

                  treeUpdates.push({
                    path: contentFile.path,
                    mode: '100644',
                    type: 'blob',
                    sha: newBlobSha
                  });
                  updatedContentCount++;
                }
              }
            }

            statusBox.innerHTML = `<span>⏳ Step 3/4: Creating Git commit with ${treeUpdates.length} change(s)...</span>`;

            // 3. Create new tree
            const newTreeRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/git/trees`, {
              method: 'POST',
              headers,
              body: JSON.stringify({
                base_tree: baseTreeSha,
                tree: treeUpdates
              })
            });
            if (!newTreeRes.ok) throw new Error(`Failed to create Git tree: ${await newTreeRes.text()}`);
            const newTreeSha = (await newTreeRes.json()).sha;

            // 4. Create commit
            const commitMessage = `Move ${selectedFiles.length} image(s) to ${finalFolder} and update links`;
            const newCommitRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/git/commits`, {
              method: 'POST',
              headers,
              body: JSON.stringify({
                message: commitMessage,
                tree: newTreeSha,
                parents: [commitSha]
              })
            });
            if (!newCommitRes.ok) throw new Error(`Failed to create commit: ${await newCommitRes.text()}`);
            const newCommitSha = (await newCommitRes.json()).sha;

            statusBox.innerHTML = `<span>⏳ Step 4/4: Updating ${GITHUB_BRANCH} branch...</span>`;

            // 5. Update branch reference
            const updateRefRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/git/refs/heads/${GITHUB_BRANCH}`, {
              method: 'PATCH',
              headers,
              body: JSON.stringify({
                sha: newCommitSha
              })
            });
            if (!updateRefRes.ok) throw new Error(`Failed to update branch ref: ${await updateRefRes.text()}`);

            statusBox.className = 'cms-move-status success';
            statusBox.innerHTML = `
              <div>
                <strong>✨ Successfully moved ${selectedFiles.length} image(s) to ${finalFolder}!</strong>
                <br />
                <span style="font-size: 0.775rem;">Updated references in ${updatedContentCount} post(s). Commit: <code>${newCommitSha.slice(0, 7)}</code></span>
              </div>
            `;

            submitBtn.textContent = 'Refresh CMS';
            submitBtn.disabled = false;
            submitBtn.onclick = () => window.location.reload();
          } catch (err) {
            statusBox.className = 'cms-move-status error';
            statusBox.innerHTML = `<div><strong>Error moving assets:</strong> ${err.message}</div>`;
            submitBtn.disabled = false;
            cancelBtn.disabled = false;
          }
        });
      }

      function initMediaMoveFeature() {
        // 1. Create persistent Floating Action Button (FAB)
        let fab = document.querySelector('.cms-move-asset-fab');
        if (!fab) {
          fab = document.createElement('button');
          fab.type = 'button';
          fab.className = 'cms-move-asset-fab';
          fab.title = 'Move selected images to a subfolder';
          fab.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              <polyline points="12 11 12 17"></polyline>
              <polyline points="9 14 12 11 15 14"></polyline>
            </svg>
            <span>Move to Folder</span>
            <span class="cms-move-asset-badge" style="display: none;">0</span>
          `;
          document.body.appendChild(fab);

          fab.addEventListener('click', () => {
            const selected = detectSelectedAssetPaths();
            openMoveAssetsDialog(selected);
          });
        }

        // Toggle FAB visibility based on route
        function updateFabVisibility() {
          const isMedia = window.location.hash.startsWith('#/assets') ||
                          window.location.hash.includes('media') ||
                          document.querySelector('dialog[open], .sui.dialog[open]');
          fab.style.display = isMedia ? 'inline-flex' : 'none';

          const selected = detectSelectedAssetPaths();
          const badge = fab.querySelector('.cms-move-asset-badge');
          if (badge) {
            badge.style.display = selected.length > 0 ? 'inline-block' : 'none';
            badge.textContent = selected.length;
          }
        }

        window.addEventListener('hashchange', updateFabVisibility);
        document.addEventListener('selectionchange', updateFabVisibility);

        // 2. Observe DOM to inject into Sveltia CMS action toolbars & detail panels
        const observer = new MutationObserver(() => {
          updateFabVisibility();

          // Inject button into Sveltia action bars if present
          const actionBars = document.querySelectorAll('header, [role="toolbar"], .actions, .sui.dialog footer');
          actionBars.forEach(bar => {
            const hasDelete = bar.querySelector('button[aria-label*="Delete" i], button[title*="Delete" i]');
            if (hasDelete && !bar.querySelector('.cms-injected-move-btn')) {
              const moveBtn = document.createElement('button');
              moveBtn.type = 'button';
              moveBtn.className = 'sui button cms-injected-move-btn';
              moveBtn.innerHTML = `
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                Move
              `;
              moveBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const selected = detectSelectedAssetPaths();
                openMoveAssetsDialog(selected);
              });
              hasDelete.parentElement.insertBefore(moveBtn, hasDelete);
            }
          });
        });

        observer.observe(document.body, { childList: true, subtree: true, attributes: true });
        updateFabVisibility();
      }

      // Initialize
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
          initLinkDialogObserver();
          syncArticles();
          initMediaMoveFeature();
        });
      } else {
        initLinkDialogObserver();
        syncArticles();
        initMediaMoveFeature();
      }
    </script>
  </body>
</html>
