backend:
  name: github
  repo: write-tim/timothyjohnsonwrites
  branch: main
  base_url: https://sveltia-gatekeeper.onrender.com
  auth_endpoint: auth

media_folder: "public/assets"
public_folder: "/assets"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    format: "yaml-frontmatter"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "string", required: false }
      - {
          label: "Publish Date",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DDTHH:mm:ssZ",
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
        }
      - {
          label: "Updated Date",
          name: "updated",
          widget: "datetime",
          required: false,
          format: "YYYY-MM-DDTHH:mm:ssZ",
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
        }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          options: ["life", "travel", "adventures", "tech"],
          default: "life",
        }
      - {
          label: "Author",
          name: "author",
          widget: "string",
          default: "Timothy Johnson",
        }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - {
          label: "Draft",
          name: "draft",
          widget: "boolean",
          default: false,
          required: false,
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "trips"
    label: "Travel Trips"
    folder: "src/content/trips"
    create: true
    slug: "{{slug}}"
    format: "yaml-frontmatter"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Place", name: "place", widget: "string" }
      - {
          label: "Date",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - { label: "Summary", name: "summary", widget: "string" }
      - { label: "Hero Image", name: "heroImage", widget: "image" }
      - { label: "Highlights", name: "highlights", widget: "list", required: false, default: [] }
      - { label: "Rotating Circle Photos", name: "circlePhotos", widget: "list", required: false, default: [], field: { label: "Photo", name: "photo", widget: "image" } }
      - { label: "Gallery Photos", name: "gallery", widget: "list", required: false, default: [], field: { label: "Photo", name: "photo", widget: "image" } }
      - {
          label: "Hide Trip (Draft)",
          name: "draft",
          widget: "boolean",
          default: false,
          required: false,
          hint: "Toggle on to hide this travel post from the site."
        }
      - { label: "Story (Body)", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home Page"
        file: "src/content/pages/home.md"
        fields:
          - { label: "Greeting", name: "greeting", widget: "string", default: "Hello, we're" }
          - { label: "First Name / Brand", name: "firstName", widget: "string", default: "The" }
          - { label: "Last Name / Accent", name: "lastName", widget: "string", default: "Funhavers" }
          - {
              label: "Typing Animation Roles",
              name: "typingRoles",
              widget: "list",
              default: ["the funhavers", "weekend adventurers", "storytellers", "outdoor enthusiasts"],
              hint: "Words typed out one by one under your name",
            }
          - {
              label: "Bio / Tagline",
              name: "bio",
              widget: "text",
              default: "Pictures, or it didn't happen. Adventure is out there... let's go find it.",
            }
          - {
              label: "Avatar / Profile Picture",
              name: "avatar",
              widget: "image",
              default: "/img/avatar.svg",
              required: false,
            }
          - label: "Hero Buttons / Social Links"
            name: "buttons"
            widget: "list"
            required: false
            hint: "Buttons shown under your bio in the hero card. Add, edit, delete, reorder, or toggle visibility."
            fields:
              - { label: "Button Label", name: "label", widget: "string", hint: "e.g. GitHub, Email, Portfolio, RSS, LinkedIn" }
              - { label: "Button Link (URL)", name: "url", widget: "string", hint: "e.g. https://github.com/..., mailto:..., /work, /resume/Resume.pdf" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                required: false
                default: "auto"
                options:
                  - { label: "Auto-detect (from label/URL)", value: "auto" }
                  - { label: "GitHub", value: "github" }
                  - { label: "LinkedIn", value: "linkedin" }
                  - { label: "Email", value: "email" }
                  - { label: "Portfolio / Website (Globe)", value: "globe" }
                  - { label: "RSS Feed", value: "rss" }
                  - { label: "YouTube", value: "youtube" }
                  - { label: "X / Twitter", value: "x" }
                  - { label: "Instagram", value: "instagram" }
                  - { label: "Download / PDF", value: "download" }
                  - { label: "Document / Resume (File)", value: "file-text" }
                  - { label: "Phone", value: "phone" }
                  - { label: "Arrow Right (Link)", value: "arrow-right" }
                  - { label: "None (Text Only)", value: "none" }
              - { label: "Visible?", name: "show", widget: "boolean", default: true }
          - {
              label: "Additional Content (Optional)",
              name: "body",
              widget: "markdown",
              required: false,
              hint: "Extra content displayed below the hero card on the home page.",
            }
      - name: "work"
        label: "Work Page"
        file: "src/content/pages/work.md"
        fields:
          - { label: "Page Eyebrow / Title", name: "title", widget: "string", default: "Work" }
          - { label: "Your Name", name: "name", widget: "string", default: "Timothy M. Johnson" }
          - { label: "Current Headline Role", name: "currentRole", widget: "string", default: "Technical Writer" }
          - { label: "Current Headline Company", name: "currentCompany", widget: "string", default: "PayIt" }
          - { label: "Location", name: "location", widget: "string", default: "Remote" }
          - { label: "Show Location in Header?", name: "showLocation", widget: "boolean", default: true }
          - { label: "Phone Number", name: "phone", widget: "string", required: false, default: "(618) 534-2098", hint: "e.g. (618) 534-2098. Can be toggled on/off below." }
          - { label: "Show Phone Number in Header?", name: "showPhone", widget: "boolean", default: true }
          - label: "Header Contact & Social Links"
            name: "contactLinks"
            widget: "list"
            required: false
            hint: "Custom links displayed in the header row (Portfolio, GitHub, Email, LinkedIn, etc.). Add, remove, reorder, or toggle visibility."
            fields:
              - { label: "Link Label", name: "label", widget: "string", hint: "e.g. Portfolio, GitHub, Email, LinkedIn" }
              - { label: "Link URL", name: "url", widget: "string", hint: "e.g. https://..., mailto:..., or tel:..." }
              - { label: "Show in Header?", name: "show", widget: "boolean", default: true }
          - label: "Experience Timeline"
            name: "experience"
            widget: "list"
            fields:
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Company", name: "company", widget: "string" }
              - { label: "Company URL", name: "companyUrl", widget: "string", required: false }
              - { label: "Location", name: "location", widget: "string", default: "Remote" }
              - { label: "Start Date", name: "start", widget: "string", hint: "e.g. Jul 2024" }
              - { label: "End Date", name: "end", widget: "string", hint: "e.g. Present or Jun 2024" }
              - { label: "Is Current Role?", name: "current", widget: "boolean", default: false }
              - { label: "Summary", name: "summary", widget: "text", hint: "One-line summary of what you owned or led" }
              - { label: "Bullet Points", name: "bullets", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
              - { label: "Tech Badges", name: "badges", widget: "list", required: false, field: { label: "Badge", name: "badge", widget: "string" } }
          - label: "Earlier Roles (Compact)"
            name: "earlierRoles"
            widget: "list"
            required: false
            fields:
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Company", name: "company", widget: "string" }
              - { label: "Start", name: "start", widget: "string" }
              - { label: "End", name: "end", widget: "string" }
          - label: "Education"
            name: "education"
            widget: "list"
            required: false
            fields:
              - { label: "Degree", name: "degree", widget: "string", hint: "e.g. Bachelor's Degree" }
              - { label: "Field", name: "field", widget: "string", hint: "e.g. English" }
              - { label: "School", name: "school", widget: "string" }
              - { label: "Start Year", name: "start", widget: "string", required: false }
              - { label: "End Year", name: "end", widget: "string", required: false }
          - label: "Skill Groups"
            name: "skillGroups"
            widget: "list"
            required: false
            fields:
              - { label: "Group Title", name: "title", widget: "string", hint: "e.g. Languages, Platforms & Tools" }
              - { label: "Skills", name: "skills", widget: "list", field: { label: "Skill", name: "skill", widget: "string" } }
          - {
              label: "Intro / Overview (Optional Markdown)",
              name: "body",
              widget: "markdown",
              required: false,
              hint: "Introductory paragraph or work philosophy displayed on the work page.",
            }
      - name: "projects"
        label: "Projects Page"
        file: "src/content/pages/projects.md"
        fields:
          - { label: "Page Title", name: "title", widget: "string", default: "Projects" }
          - { label: "Eyebrow / Subheading", name: "eyebrow", widget: "string", default: "Case Studies & Architecture", required: false }
          - {
              label: "Introductory Overview",
              name: "intro",
              widget: "text",
              required: false,
              hint: "Introductory overview paragraphs explaining your approach to independent architecture, docs, and engineering.",
            }
          - label: "Projects & Case Studies"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Project Title", name: "title", widget: "string" }
              - { label: "Live Project / Docs URL", name: "url", widget: "string", required: false, hint: "e.g. https://docs.timothyjohnsonwrites.com" }
              - { label: "Link Display Text", name: "linkText", widget: "string", required: false, hint: "e.g. docs.timothyjohnsonwrites.com (optional)" }
              - { label: "Focus / Subtitle", name: "focus", widget: "string", required: false, hint: "e.g. Administrative User Assistance, Integration Setup Guides & UI Microcopy" }
              - { label: "Overview", name: "overview", widget: "text", required: false }
              - {
                  label: "Tech Stack Badges",
                  name: "techStack",
                  widget: "list",
                  required: false,
                  field: { label: "Tech", name: "tech", widget: "string" },
                }
              - {
                  label: "The Communication Challenge",
                  name: "challenge",
                  widget: "text",
                  required: false,
                  hint: "Explanation of user friction, OAuth setup, or developer onboarding problems solved.",
                }
              - {
                  label: "Deliverables / Features Section Title",
                  name: "featuresTitle",
                  widget: "string",
                  default: "Key Architectural Features",
                  required: false,
                }
              - label: "Key Features & Deliverables"
                name: "features"
                widget: "list"
                required: false
                fields:
                  - { label: "Feature / Deliverable Title", name: "title", widget: "string", hint: "e.g. Decoupled Content Strategy" }
                  - { label: "Description", name: "description", widget: "text" }
          - {
              label: "Additional Content (Optional Markdown)",
              name: "body",
              widget: "markdown",
              required: false,
              hint: "Any additional notes, case studies, or markdown content to display at the bottom of the page.",
            }
      - name: "header_footer"
        label: "Site Identity, Header & Footer"
        file: "src/content/pages/header-footer.md"
        fields:
          # Site Identity & Browser Tab
          - {
              label: "Site Name (Home Page Tab Title)",
              name: "siteTitle",
              widget: "string",
              default: "The Funhavers",
              hint: "Title displayed in the browser tab on the home page, and used for OpenGraph / RSS.",
            }
          - {
              label: "Tab Title Suffix (Subpages)",
              name: "tabTitleSuffix",
              widget: "string",
              default: "thefunhavers",
              hint: "Text appended to subpage titles in the browser tab (e.g. 'Work · thefunhavers', 'Blog · thefunhavers').",
            }
          - {
              label: "Favicon Image",
              name: "favicon",
              widget: "image",
              default: "/assets/favicon.svg",
              required: false,
              hint: "Upload an SVG, PNG, or ICO image to display as the site favicon in the browser tab.",
            }
          - {
              label: "Default Meta Description",
              name: "siteDescription",
              widget: "text",
              required: false,
              default: "Pictures, or it didn't happen. Adventure is out there... let's go find it.",
              hint: "Default search engine and social preview description.",
            }

          # Header settings
          - { label: "Brand Name", name: "brandName", widget: "string", default: "thefunhavers", hint: "Displayed in the top left of the header." }
          - { label: "Brand Prefix", name: "brandPrefix", widget: "string", default: ">", required: false, hint: "Symbol before brand name (e.g. >)" }
          - { label: "Brand Suffix / Cursor", name: "brandSuffix", widget: "string", default: "_", required: false, hint: "Symbol after brand name (e.g. _)" }
          - { label: "Show Dark/Light Theme Toggle?", name: "showThemeToggle", widget: "boolean", default: true }
          - label: "Header Navigation Items"
            name: "navLinks"
            widget: "list"
            typeKey: "type"
            hint: "Top navigation items. Add direct links (Home) or dropdown menu buckets (Personal, Professional) with nested sub-links."
            types:
              - label: "Direct Link (e.g. Home)"
                name: "link"
                widget: "object"
                fields:
                  - { label: "Link Label", name: "label", widget: "string", hint: "e.g. Home, Contact" }
                  - { label: "Link URL", name: "url", widget: "string", hint: "e.g. /, /about, or https://..." }
                  - { label: "Visible in Header?", name: "show", widget: "boolean", default: true }
              - label: "Dropdown Menu Bucket (e.g. Personal, Professional)"
                name: "dropdown"
                widget: "object"
                fields:
                  - { label: "Bucket / Menu Title", name: "label", widget: "string", hint: "e.g. Personal, Professional, Resources" }
                  - { label: "Visible in Header?", name: "show", widget: "boolean", default: true }
                  - label: "Sub-Links in this Bucket"
                    name: "children"
                    widget: "list"
                    hint: "Add, edit, remove, or reorder the links inside this bucket."
                    fields:
                      - { label: "Sub-Link Label", name: "label", widget: "string", hint: "e.g. Blog, Travel, Work, Projects" }
                      - { label: "Sub-Link URL", name: "url", widget: "string", hint: "e.g. /blog, /travel, /work, /projects" }
                      - { label: "Visible?", name: "show", widget: "boolean", default: true }

          # Footer settings
          - { label: "Show Footer Navigation Links?", name: "showFooterNav", widget: "boolean", default: true }
          - label: "Footer Navigation Links (Row 1)"
            name: "footerNavLinks"
            widget: "list"
            required: false
            hint: "Top row of links in the footer. If left empty, mirrors the header navigation links."
            fields:
              - { label: "Link Label", name: "label", widget: "string", hint: "e.g. Home, Work, Blog, Travel" }
              - { label: "Link URL", name: "url", widget: "string", required: false, hint: "e.g. /, /work, /blog, /travel, or https://..." }
              - { label: "Visible in Footer?", name: "show", widget: "boolean", default: true }

          - { label: "Show Footer Social / External Links?", name: "showFooterSocials", widget: "boolean", default: true }
          - label: "Footer Social & External Links (Row 2)"
            name: "footerSocialLinks"
            widget: "list"
            required: false
            hint: "Second row of links in the footer (GitHub, Email, Portfolio, RSS, LinkedIn, etc.)."
            fields:
              - { label: "Link Label", name: "label", widget: "string", hint: "e.g. GitHub, Email, Portfolio, RSS, LinkedIn" }
              - { label: "Link URL", name: "url", widget: "string", hint: "e.g. https://github.com/..., mailto:..., or https://..." }
              - { label: "Visible in Footer?", name: "show", widget: "boolean", default: true }

          - {
              label: "Copyright Text",
              name: "copyrightText",
              widget: "string",
              default: "© {year} Timothy M. Johnson · United States",
              hint: "Use {year} to automatically output the current calendar year.",
            }

  - name: "custom_pages"
    label: "Custom Pages"
    label_singular: "Custom Page"
    folder: "src/content/custom-pages"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} (/{{slug}})"
    fields:
      - { label: "Page Title", name: "title", widget: "string" }
      - {
          label: "URL Slug / Path",
          name: "slug",
          widget: "string",
          hint: "The URL path for this page (e.g. 'about', 'contact', 'colophon', or nested like 'personal/reading-list'). Do NOT include leading or trailing slashes.",
        }
      - {
          label: "Eyebrow / Subheading",
          name: "eyebrow",
          widget: "string",
          required: false,
          hint: "Optional small category or accent text displayed above the title.",
        }
      - {
          label: "Meta Description",
          name: "description",
          widget: "text",
          required: false,
          hint: "Optional summary for SEO and social sharing cards.",
        }
      - {
          label: "Hero / Featured Image",
          name: "image",
          widget: "image",
          required: false,
          hint: "Optional header image for this page.",
        }
      - label: "Navigation Placement"
        name: "navPlacement"
        widget: "select"
        default: "none"
        options:
          - { label: "Do not add automatically (Manage manually in Header & Footer)", value: "none" }
          - { label: "Personal (Nest under Personal dropdown)", value: "personal" }
          - { label: "Professional (Nest under Professional dropdown)", value: "professional" }
          - { label: "Top Level (Add to main header bar)", value: "top" }
        hint: "Where to automatically nest this page in the site menu."
      - {
          label: "Navigation Label (Optional)",
          name: "navLabel",
          widget: "string",
          required: false,
          hint: "Optional shorter label for navigation (defaults to Page Title).",
        }
      - {
          label: "Navigation Order / Weight",
          name: "navOrder",
          widget: "number",
          default: 100,
          value_type: "int",
          required: false,
          hint: "Order when automatically placed in navigation (smaller numbers appear first).",
        }
      - {
          label: "Show in Footer Links?",
          name: "showInFooter",
          widget: "boolean",
          default: false,
          hint: "Automatically append this page to the footer navigation links.",
        }
      - { label: "Page Content", name: "body", widget: "markdown" }



